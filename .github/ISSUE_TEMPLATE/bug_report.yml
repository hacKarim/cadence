name: Bug report
description: Something the engine does that it should not
labels: [bug]
body:
  - type: textarea
    id: workflow
    attributes:
      label: The workflow
      description: The smallest YAML that shows the problem.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: doctor
    attributes:
      label: Output of `cadence doctor`
      description: It reports the sandbox backend in use, which decides most of these.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `cadence version`
    validations:
      required: true
